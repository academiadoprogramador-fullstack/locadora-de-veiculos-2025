<section class="mx-auto max-w-screen-xl px-4">
  <div class="py-6">
    <h2 class="text-2xl font-semibold">Listagem de Veículos</h2>

    <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-2">
      <a
        mat-flat-button
        class="col-span-1 flex items-center justify-center gap-2 h-10"
        routerLink="cadastrar"
      >
        <mat-icon class="!text-base">add</mat-icon>
        Cadastrar
      </a>
    </div>

    <hr class="my-6 border-muted/30" />

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      @for (veiculo of veiculos$ | async; track $index) {
        <mat-card class="rounded-2xl shadow-sm overflow-hidden h-full flex flex-col">
          <img
            mat-card-image
            class="w-full h-48 object-cover"
            [src]="urlPublicoS3 + veiculo.imagem"
            alt="Foto do veículo"
          />

          <mat-card-header class="px-4 pt-4 pb-2">
            <mat-card-title class="text-lg font-medium">
              {{ veiculo.marca }} {{ veiculo.modelo }}
            </mat-card-title>
          </mat-card-header>

          <mat-card-content class="px-4 min-h-[40px] flex-grow mt-2">
            <p><span class="font-medium">Ano:</span> {{ veiculo.ano }}</p>
            <p>
              <span class="font-medium">Tipo de Combustível:</span>
              {{ veiculo.tipoCombustivel }}
            </p>
            <p>
              <span class="font-medium">Capacidade do Tanque:</span>
              {{ veiculo.capacidadeTanque }} lts
            </p>
          </mat-card-content>

          <mat-card-actions align="end" class="flex items-center justify-end gap-2 px-4 pb-4">
            <a [routerLink]="['editar', veiculo.id]" mat-icon-button aria-label="Editar">
              <mat-icon>edit</mat-icon>
            </a>
            <a [routerLink]="['excluir', veiculo.id]" mat-icon-button aria-label="Excluir">
              <mat-icon>delete</mat-icon>
            </a>
          </mat-card-actions>
        </mat-card>
      }
    </div>
  </div>
</section>
